<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CryptoSky · Air</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            padding: 20px 16px 40px;
            display: flex;
            flex-direction: column;
            background: linear-gradient(145deg, #e8e0d5 0%, #d6cdc0 100%);
            color: #2c2a28;
            position: relative;
            transition: background 0.8s ease;
        }

        body.state-scanning {
            background: linear-gradient(145deg, #f5e6c8 0%, #e8d5a8 100%);
        }

        body.state-done {
            background: linear-gradient(145deg, #d4e8d4 0%, #b8d4b8 100%);
        }

        body.state-stopped {
            background: linear-gradient(145deg, #f0d4d4 0%, #e0b8b8 100%);
        }

        body.state-error {
            background: linear-gradient(145deg, #f0d0d0 0%, #e0b0b0 100%);
        }

        .glass-layer {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(circle at 20% 20%, rgba(255, 245, 235, 0.2), transparent 60%),
                        radial-gradient(circle at 80% 80%, rgba(235, 225, 215, 0.15), transparent 50%);
            transition: opacity 0.8s ease;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 440px;
            margin: 0 auto;
            width: 100%;
        }

        .glass {
            background: rgba(255, 248, 242, 0.45);
            backdrop-filter: blur(40px) saturate(1.2);
            -webkit-backdrop-filter: blur(40px) saturate(1.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 32px;
            padding: 20px 18px;
            margin-bottom: 16px;
            box-shadow: 0 12px 40px -8px rgba(0, 0, 0, 0.08),
                        0 1px 0 0 rgba(255, 255, 255, 0.6) inset;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .glass:active {
            transform: scale(0.98);
        }

        /* --- HEADER С БАДЖЕМ --- */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding: 0 4px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            color: #2c2a28;
            letter-spacing: -0.5px;
        }

        .status-badge {
            font-size: 13px;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 40px;
            background: rgba(44, 42, 40, 0.06);
            color: rgba(44, 42, 40, 0.5);
            transition: all 0.4s ease;
            white-space: nowrap;
        }

        .status-badge.scanning {
            background: rgba(200, 160, 60, 0.2);
            color: #8a7a3a;
            animation: pulseBadge 1.2s infinite;
        }

        .status-badge.done {
            background: rgba(80, 160, 80, 0.2);
            color: #3a7a3a;
        }

        .status-badge.stopped {
            background: rgba(200, 80, 80, 0.2);
            color: #8a3a3a;
        }

        .status-badge.error {
            background: rgba(200, 60, 60, 0.2);
            color: #8a2a2a;
        }

        @keyframes pulseBadge {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* --- СТАТУС СКАНЕРА (ГЛАВНЫЙ) --- */
        .scan-status {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .scan-status .main-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .scan-status .spinner {
            width: 22px;
            height: 22px;
            border: 2px solid rgba(44, 42, 40, 0.1);
            border-top-color: #2c2a28;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }

        .scan-status .spinner.hidden {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .scan-status .main-text {
            font-size: 16px;
            font-weight: 500;
            color: #2c2a28;
        }

        .scan-status .main-text .highlight {
            font-weight: 600;
        }

        .scan-status .sub-text {
            font-size: 14px;
            color: rgba(44, 42, 40, 0.5);
            margin-left: 34px;
        }

        .scan-status .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(44, 42, 40, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-left: 34px;
        }

        .scan-status .progress-bar .fill {
            height: 100%;
            background: #2c2a28;
            border-radius: 4px;
            transition: width 0.4s ease;
            width: 0%;
        }

        .label {
            font-size: 12px;
            font-weight: 600;
            color: rgba(44, 42, 40, 0.35);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            display: block;
            margin-bottom: 6px;
        }

        .input-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 4px;
        }

        .input-group .field {
            flex: 1;
            min-width: 70px;
        }

        .input-group .field label {
            font-size: 11px;
            color: rgba(44, 42, 40, 0.3);
            display: block;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .input-group .field input {
            width: 100%;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 18px;
            padding: 14px 16px;
            font-size: 16px;
            font-weight: 500;
            color: #2c2a28;
            outline: none;
            transition: 0.25s ease;
            backdrop-filter: blur(10px);
        }

        .input-group .field input:focus {
            border-color: #b8a99a;
            background: rgba(255, 255, 255, 0.7);
            box-shadow: 0 0 0 4px rgba(184, 169, 154, 0.15);
        }

        .btn {
            width: 100%;
            padding: 16px 20px;
            border: none;
            border-radius: 22px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: rgba(44, 42, 40, 0.85);
            color: #f5f0ea;
            box-shadow: 0 4px 16px rgba(44, 42, 40, 0.08);
            backdrop-filter: blur(10px);
        }

        .btn-primary:active {
            transform: scale(0.96);
            background: rgba(44, 42, 40, 0.95);
        }

        .btn-danger {
            background: rgba(200, 80, 80, 0.85);
            color: #fff;
            box-shadow: 0 4px 16px rgba(200, 80, 80, 0.15);
            backdrop-filter: blur(10px);
        }

        .btn-danger:active {
            transform: scale(0.96);
            background: rgba(200, 80, 80, 0.95);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.6);
            color: #2c2a28;
            backdrop-filter: blur(10px);
        }

        .btn-secondary:active {
            background: rgba(255, 255, 255, 0.6);
            transform: scale(0.97);
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-group-row {
            display: flex;
            gap: 12px;
        }

        .btn-group-row .btn {
            flex: 1;
        }

        .api-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .api-row input {
            flex: 1;
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 18px;
            padding: 12px 16px;
            font-size: 14px;
            color: #2c2a28;
            outline: none;
            backdrop-filter: blur(10px);
        }

        .api-row input:focus {
            border-color: #b8a99a;
            background: rgba(255, 255, 255, 0.6);
        }

        .api-row .btn-small {
            padding: 12px 20px;
            border-radius: 18px;
            border: none;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #2c2a28;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
        }

        .api-row .btn-small:active {
            background: rgba(255, 255, 255, 0.5);
        }

        .signal-card {
            border-left: 3px solid #b8a99a;
            padding-left: 14px;
            margin-bottom: 14px;
        }

        .signal-card.shot {
            border-left-color: #c9a8a8;
        }

        .signal-card.long {
            border-left-color: #a8c9b0;
        }

        .signal-card .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .signal-card .row .symbol {
            font-weight: 700;
            font-size: 18px;
            color: #2c2a28;
        }

        .signal-card .row .side {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 14px;
            border-radius: 40px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            background: rgba(44, 42, 40, 0.06);
            color: rgba(44, 42, 40, 0.6);
        }

        .signal-card .row .side.shot {
            background: rgba(201, 168, 168, 0.15);
            color: #9a7a7a;
        }

        .signal-card .row .side.long {
            background: rgba(168, 201, 176, 0.15);
            color: #5a8a6a;
        }

        .signal-card .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 14px;
            font-size: 13px;
            color: rgba(44, 42, 40, 0.4);
            margin-top: 8px;
        }

        .signal-card .meta .highlight {
            color: #2c2a28;
            font-weight: 500;
        }

        .signal-card .badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 20px;
            background: rgba(44, 42, 40, 0.06);
            color: rgba(44, 42, 40, 0.5);
        }

        .signal-card .badge.green {
            background: rgba(125, 155, 122, 0.15);
            color: #5a8a6a;
        }

        .signal-card .badge.orange {
            background: rgba(200, 160, 100, 0.15);
            color: #b08a4a;
        }

        .signal-card .badge.red {
            background: rgba(200, 120, 120, 0.15);
            color: #9a5a5a;
        }

        .status-text {
            text-align: center;
            font-size: 14px;
            color: rgba(44, 42, 40, 0.25);
            padding: 20px 0;
            letter-spacing: 0.3px;
        }

        .fade-in {
            animation: fadeUp 0.6s ease both;
        }
        .fade-in-d1 { animation-delay: 0.05s; }
        .fade-in-d2 { animation-delay: 0.1s; }
        .fade-in-d3 { animation-delay: 0.15s; }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .mt-1 { margin-top: 8px; }
        .flex { display: flex; align-items: center; gap: 8px; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .gap-1 { gap: 6px; }
        ::-webkit-scrollbar { width: 0; }

        /* --- АДАПТИВ ДЛЯ МАЛЕНЬКИХ ЭКРАНОВ --- */
        @media (max-width: 380px) {
            .header h1 { font-size: 20px; }
            .status-badge { font-size: 11px; padding: 4px 12px; }
            .scan-status .main-text { font-size: 14px; }
            .scan-status .sub-text { font-size: 12px; }
        }
    </style>
</head>
<body>

<div class="glass-layer"></div>

<div class="container">

    <!-- HEADER -->
    <div class="header fade-in">
        <h1>✦ CryptoSky</h1>
        <span id="statusBadge" class="status-badge">● Ожидание</span>
    </div>

    <!-- СТАТУС СКАНЕРА (ВСЕГДА ВВЕРХУ) -->
    <div class="glass fade-in fade-in-d1" id="statusCard">
        <div class="scan-status">
            <div class="main-row">
                <div class="spinner hidden" id="spinner"></div>
                <div class="main-text" id="mainStatus">
                    <span class="highlight">⏳</span> Ожидание запуска
                </div>
            </div>
            <div class="sub-text" id="subStatus"></div>
            <div class="progress-bar">
                <div class="fill" id="progressFill" style="width:0%;"></div>
            </div>
        </div>
    </div>

    <!-- API URL -->
    <div class="glass fade-in fade-in-d1">
        <div class="api-row">
            <input type="text" id="apiUrlInput" placeholder="https://твой-адрес.ngrok-free.dev">
            <button class="btn-small" onclick="setApiUrl()">Обновить</button>
        </div>
    </div>

    <!-- НАСТРОЙКИ -->
    <div class="glass fade-in fade-in-d2">
        <span class="label">⚙️ Параметры</span>
        <div class="input-group">
            <div class="field">
                <label>Объём (M$)</label>
                <input type="number" id="volumeFilter" value="50" step="10">
            </div>
            <div class="field">
                <label>ATR %</label>
                <input type="number" id="atrFilter" value="50" step="5">
            </div>
            <div class="field">
                <label>Тейк x</label>
                <input type="number" id="riskReward" value="3.0" step="0.5">
            </div>
        </div>
        <button class="btn btn-secondary mt-1" onclick="saveSettings()">💾 Сохранить</button>
    </div>

    <!-- КНОПКИ -->
    <div class="btn-group fade-in fade-in-d3">
        <button class="btn btn-primary" onclick="runScanner()">🚀 Запустить сканер</button>
        <button class="btn btn-danger" onclick="stopScanner()" id="stopBtn" style="display:none;">⏹ Остановить сканер</button>
        <div class="btn-group-row">
            <button class="btn btn-secondary" onclick="loadHistory()">📜 История</button>
            <button class="btn btn-secondary" onclick="clearSignals()">🗑️ Очистить</button>
        </div>
    </div>

    <!-- СИГНАЛЫ -->
    <div id="signalsContainer">
        <div class="status-text">📭 Нет сигналов</div>
    </div>

    <div class="status-text" id="statusMessage" style="font-size:13px;"></div>

</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let statusInterval = null;

    function getApiUrl() {
        let url = localStorage.getItem('apiUrl');
        if (!url) {
            url = 'https://shame-edging-vagueness.ngrok-free.dev';
            localStorage.setItem('apiUrl', url);
        }
        document.getElementById('apiUrlInput').value = url;
        return url;
    }

    function setApiUrl() {
        const url = document.getElementById('apiUrlInput').value.trim();
        if (url) {
            localStorage.setItem('apiUrl', url);
            document.getElementById('statusMessage').innerText = '✅ API обновлён';
            loadSettings();
        }
    }

    // ---- УПРАВЛЕНИЕ СОСТОЯНИЕМ ИНТЕРФЕЙСА ----
    function setAppState(state, data) {
        const body = document.body;
        const badge = document.getElementById('statusBadge');
        const mainStatus = document.getElementById('mainStatus');
        const subStatus = document.getElementById('subStatus');
        const spinner = document.getElementById('spinner');
        const progress = document.getElementById('progressFill');
        const stopBtn = document.getElementById('stopBtn');

        // Сбрасываем классы
        body.className = '';
        badge.className = 'status-badge';

        switch (state) {
            case 'scanning':
                body.classList.add('state-scanning');
                badge.classList.add('scanning');
                badge.textContent = '🔍 Анализ...';
                spinner.classList.remove('hidden');
                const pct = data && data.total > 0 ? Math.round((data.checked / data.total) * 100) : 0;
                progress.style.width = pct + '%';
                mainStatus.innerHTML = `<span class="highlight">🔍</span> Сканер запущен`;
                subStatus.textContent = data && data.current_symbol ? `Проверяется: ${data.current_symbol} (${data.checked || 0} / ${data.total || 0})` : `Анализ... (${data?.checked || 0} / ${data?.total || 0})`;
                stopBtn.style.display = 'block';
                break;

            case 'done':
                body.classList.add('state-done');
                badge.classList.add('done');
                badge.textContent = '✅ Завершён';
                spinner.classList.add('hidden');
                progress.style.width = '100%';
                mainStatus.innerHTML = `<span class="highlight">✅</span> Анализ завершён`;
                subStatus.textContent = data ? `Проверено ${data.total || 0} монет` : 'Готово';
                stopBtn.style.display = 'none';
                break;

            case 'stopped':
                body.classList.add('state-stopped');
                badge.classList.add('stopped');
                badge.textContent = '⏹ Остановлен';
                spinner.classList.add('hidden');
                progress.style.width = '0%';
                mainStatus.innerHTML = `<span class="highlight">⏹</span> Остановлен пользователем`;
                subStatus.textContent = '';
                stopBtn.style.display = 'none';
                break;

            case 'error':
                body.classList.add('state-error');
                badge.classList.add('error');
                badge.textContent = '❌ Ошибка';
                spinner.classList.add('hidden');
                mainStatus.innerHTML = `<span class="highlight">❌</span> ${data?.current_symbol || 'Ошибка'}`;
                subStatus.textContent = '';
                stopBtn.style.display = 'none';
                break;

            default: // idle
                body.className = '';
                badge.className = 'status-badge';
                badge.textContent = '● Ожидание';
                spinner.classList.add('hidden');
                progress.style.width = '0%';
                mainStatus.innerHTML = `<span class="highlight">⏳</span> Ожидание запуска`;
                subStatus.textContent = '';
                stopBtn.style.display = 'none';
                break;
        }
    }

    // ---- СТАТУС СКАНЕРА ----
    async function updateStatusUI() {
        const apiUrl = getApiUrl();
        try {
            const resp = await fetch(apiUrl + '/status');
            if (!resp.ok) return;
            const data = await resp.json();

            if (data.status === 'scanning') {
                setAppState('scanning', data);
            } else if (data.status === 'done') {
                setAppState('done', data);
            } else if (data.status === 'stopped') {
                setAppState('stopped');
            } else if (data.status === 'error') {
                setAppState('error', data);
            } else {
                setAppState('idle');
            }
        } catch (e) {
            // при ошибке соединения оставляем текущее состояние
        }
    }

    async function startStatusPolling() {
        if (statusInterval) clearInterval(statusInterval);
        await updateStatusUI();
        statusInterval = setInterval(updateStatusUI, 2000);
    }

    // ---- ОСТАНОВКА СКАНЕРА ----
    async function stopScanner() {
        const apiUrl = getApiUrl();
        document.getElementById('statusMessage').innerText = '⏳ Остановка...';
        try {
            const resp = await fetch(apiUrl + '/stop_scanner', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            });
            const data = await resp.json();
            if (data.status === 'stop_requested') {
                document.getElementById('statusMessage').innerText = '⏹ Сканер остановлен';
            } else {
                document.getElementById('statusMessage').innerText = 'ℹ️ Сканер не запущен';
            }
            await updateStatusUI();
        } catch (e) {
            document.getElementById('statusMessage').innerText = '❌ Ошибка: ' + e.message;
        }
    }

    // ---- ЗАГРУЗКА НАСТРОЕК ----
    async function loadSettings() {
        const apiUrl = getApiUrl();
        try {
            const resp = await fetch(apiUrl + '/settings');
            if (!resp.ok) throw new Error('Ошибка загрузки');
            const data = await resp.json();
            if (data.volume) document.getElementById('volumeFilter').value = data.volume;
            if (data.atr) document.getElementById('atrFilter').value = data.atr;
            if (data.risk_reward) document.getElementById('riskReward').value = data.risk_reward;
            document.getElementById('statusMessage').innerText = '✅ Настройки загружены';
        } catch (e) {
            document.getElementById('statusMessage').innerText = '❌ Ошибка загрузки: ' + e.message;
        }
    }

    // ---- СОХРАНЕНИЕ НАСТРОЕК ----
    async function saveSettings() {
        const apiUrl = getApiUrl();
        const settings = {
            volume: parseInt(document.getElementById('volumeFilter').value),
            atr: parseInt(document.getElementById('atrFilter').value),
            risk_reward: parseFloat(document.getElementById('riskReward').value)
        };
        try {
            const resp = await fetch(apiUrl + '/settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(settings)
            });
            if (!resp.ok) throw new Error('Ошибка сохранения');
            document.getElementById('statusMessage').innerText = '✅ Настройки сохранены!';
        } catch (e) {
            document.getElementById('statusMessage').innerText = '❌ Ошибка сохранения: ' + e.message;
        }
    }

    // ---- ЗАПУСК СКАНЕРА ----
    async function runScanner() {
        const apiUrl = getApiUrl();
        document.getElementById('statusMessage').innerText = '⏳ Запуск сканера...';
        try {
            const resp = await fetch(apiUrl + '/run_scanner', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: 1907661832 })
            });
            if (!resp.ok) throw new Error('Ошибка запуска');
            document.getElementById('statusMessage').innerText = '✅ Сканер запущен. Смотрите прогресс!';
            startStatusPolling();
        } catch (e) {
            document.getElementById('statusMessage').innerText = '❌ Ошибка: ' + e.message;
        }
    }

    // ---- ИСТОРИЯ ----
    async function loadHistory() {
        const apiUrl = getApiUrl();
        document.getElementById('statusMessage').innerText = '⏳ Загрузка истории...';
        try {
            const resp = await fetch(apiUrl + '/history');
            if (!resp.ok) throw new Error('Ошибка загрузки');
            const data = await resp.json();
            if (data.length === 0) {
                document.getElementById('statusMessage').innerText = '📭 История пуста';
                displaySignals([]);
                return;
            }
            displaySignals(data);
            document.getElementById('statusMessage').innerText = `📜 Показано ${data.length} сигналов (за 7 дней)`;
        } catch (e) {
            document.getElementById('statusMessage').innerText = '❌ Ошибка: ' + e.message;
        }
    }

    function clearSignals() {
        if (confirm('Очистить список сигналов?')) {
            displaySignals([]);
            document.getElementById('statusMessage').innerText = '🗑️ Список очищен';
        }
    }

    // ---- ОТОБРАЖЕНИЕ СИГНАЛОВ ----
    function displaySignals(signals) {
        const container = document.getElementById('signalsContainer');
        if (!signals || signals.length === 0) {
            container.innerHTML = '<div class="status-text">📭 Нет сигналов</div>';
            return;
        }
        let html = '';
        signals.forEach((s, i) => {
            const sideClass = s.side && s.side.includes('LONG') ? 'long' : 'shot';
            const sideLabel = s.side || '—';
            const delay = i * 0.06;

            let statusBadge = '';
            if (s.atr_status === '🟢') statusBadge = '<span class="badge green">🔋 Много энергии</span>';
            else if (s.atr_status === '🟠') statusBadge = '<span class="badge orange">⚡ Средний запас</span>';
            else if (s.atr_status === '🔴') statusBadge = '<span class="badge red">🪫 Мало энергии</span>';

            html += `
                <div class="glass signal-card ${sideClass} fade-in" style="animation-delay: ${delay}s;">
                    <div class="row">
                        <span class="symbol">${s.symbol || '—'}</span>
                        <span class="side ${sideClass}">${sideLabel}</span>
                    </div>
                    <div class="meta">
                        <span>💰 <span class="highlight">${s.current_price || '—'}</span></span>
                        <span>📊 ${s.signal_type || '—'}</span>
                        <span>📈 ${s.level || '—'}</span>
                    </div>
                    <div class="meta">
                        <span>Вход: <span class="highlight">${s.entry || '—'}</span></span>
                        <span>Стоп: <span class="highlight">${s.stop || '—'}</span></span>
                        <span>Тейк: <span class="highlight">${s.tp || '—'}</span></span>
                    </div>
                    <div class="meta">
                        <span>📐 ${s.risk_reward || '—'}</span>
                        <span>🔁 Касаний: <span class="highlight">${s.touches || 0}</span></span>
                    </div>
                    <div class="meta">
                        <span>📊 ATR: <span class="highlight">${s.atr_used || '—'}</span></span>
                        <span>⏳ Запас: ${s.atr_consumed || 0}%</span>
                        ${statusBadge}
                    </div>
                    <div class="meta">
                        <span>💵 ${s.daily_volume_usd || '—'}M</span>
                        <span>${s.time || ''}</span>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    // ---- ПРИЁМ ДАННЫХ ОТ БОТА ----
    window.Telegram.WebApp.onEvent('data', (data) => {
        try {
            const parsed = JSON.parse(data);
            if (parsed.type === 'signals') {
                displaySignals(parsed.data);
                document.getElementById('statusMessage').innerText = `✅ Получено ${parsed.data.length} сигналов`;
            }
        } catch (e) {
            console.error('Ошибка данных от бота:', e);
        }
    });

    // ---- ИНИЦИАЛИЗАЦИЯ ----
    loadSettings();
    startStatusPolling();

    // ДЕМО-СИГНАЛЫ
    setTimeout(() => {
        const demo = [
            { symbol: 'BTCUSDT', side: 'SHORT (ОТБОЙ R1)', current_price: '61234.56', entry: '61200.00', stop: '61300.00', tp: '61100.00', daily_volume_usd: '450.2', signal_type: 'BOUNCE', level: '61250.00', risk_reward: '1:3.0', touches: 3, atr_used: '850.5', atr_consumed: '45.2', atr_status: '🟢', time: '2026-08-06 14:30' },
            { symbol: 'ETHUSDT', side: 'LONG (ПРОБОЙ S1)', current_price: '3456.78', entry: '3450.00', stop: '3440.00', tp: '3460.00', daily_volume_usd: '320.1', signal_type: 'BREAKOUT', level: '3448.00', risk_reward: '1:3.0', touches: 2, atr_used: '120.3', atr_consumed: '62.8', atr_status: '🟠', time: '2026-08-06 14:25' }
        ];
        displaySignals(demo);
    }, 700);
</script>
