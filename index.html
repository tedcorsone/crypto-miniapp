<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CryptoSky</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            padding: 16px 14px 30px;
            background: linear-gradient(145deg, #e8e0d5 0%, #d6cdc0 100%);
            color: #2c2a28;
            transition: background 0.9s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        body.state-scanning {
            background: linear-gradient(145deg, #f5e6c8 0%, #e8d5a8 100%);
        }
        body.state-done {
            background: linear-gradient(145deg, #d4e8d4 0%, #b8d4b8 100%);
        }
        body.state-stopped {
            background: linear-gradient(145deg, #f0d4d4 0%, #e0b8b8 100%);
        }
        body.state-error {
            background: linear-gradient(145deg, #f0d0d0 0%, #e0b0b0 100%);
        }

        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .bg-animation .orb {
            position: absolute;
            border-radius: 50%;
            opacity: 0.10;
            filter: blur(60px);
            animation: floatOrb 22s infinite alternate ease-in-out;
        }

        .bg-animation .orb:nth-child(1) {
            width: 280px;
            height: 280px;
            background: #d4b896;
            top: -60px;
            left: -60px;
            animation-duration: 24s;
        }
        .bg-animation .orb:nth-child(2) {
            width: 340px;
            height: 340px;
            background: #c9b8a8;
            bottom: -80px;
            right: -80px;
            animation-duration: 28s;
            animation-delay: -5s;
        }
        .bg-animation .orb:nth-child(3) {
            width: 180px;
            height: 180px;
            background: #e0d0c0;
            top: 50%;
            left: 50%;
            animation-duration: 20s;
            animation-delay: -9s;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -25px) scale(1.1); }
            100% { transform: translate(-15px, 30px) scale(0.95); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 400px;
            width: 100%;
        }

        .glass {
            background: rgba(255, 248, 242, 0.50);
            backdrop-filter: blur(30px) saturate(1.2);
            -webkit-backdrop-filter: blur(30px) saturate(1.2);
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 24px;
            padding: 14px 16px;
            margin-bottom: 12px;
            box-shadow: 0 8px 24px -8px rgba(0, 0, 0, 0.04), 0 1px 0 0 rgba(255, 255, 255, 0.5) inset;
            transition: transform 0.2s ease;
        }

        .glass:active {
            transform: scale(0.98);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #2c2a28;
            letter-spacing: -0.5px;
        }

        .badge {
            font-size: 11px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 40px;
            background: rgba(44, 42, 40, 0.06);
            color: rgba(44, 42, 40, 0.5);
            transition: all 0.4s ease;
            white-space: nowrap;
        }

        .badge.scanning {
            background: rgba(200, 160, 60, 0.2);
            color: #8a7a3a;
            animation: pulse 1.2s infinite;
        }
        .badge.done {
            background: rgba(80, 160, 80, 0.2);
            color: #3a7a3a;
        }
        .badge.stopped {
            background: rgba(200, 80, 80, 0.2);
            color: #8a3a3a;
        }
        .badge.error {
            background: rgba(200, 60, 60, 0.2);
            color: #8a2a2a;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(44, 42, 40, 0.1);
            border-top-color: #2c2a28;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }
        .spinner.hidden {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-main {
            font-size: 14px;
            font-weight: 500;
        }

        .status-sub {
            font-size: 12px;
            color: rgba(44, 42, 40, 0.5);
            margin-left: 28px;
        }

        .progress-wrap {
            margin-top: 6px;
            margin-left: 28px;
        }

        .progress-bar {
            width: 100%;
            height: 3px;
            background: rgba(44, 42, 40, 0.08);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar .fill {
            height: 100%;
            background: #2c2a28;
            border-radius: 4px;
            transition: width 0.4s ease;
            width: 0%;
        }

        .label {
            font-size: 10px;
            font-weight: 600;
            color: rgba(44, 42, 40, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
            margin-bottom: 4px;
        }

        .input-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .input-group .field {
            flex: 1;
            min-width: 56px;
        }

        .input-group .field label {
            font-size: 9px;
            color: rgba(44, 42, 40, 0.3);
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 2px;
        }

        .input-group .field input {
            width: 100%;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 14px;
            padding: 10px 12px;
            font-size: 14px;
            font-weight: 500;
            color: #2c2a28;
            outline: none;
            backdrop-filter: blur(10px);
        }

        .input-group .field input:focus {
            border-color: #b8a99a;
            background: rgba(255, 255, 255, 0.7);
        }

        .btn {
            width: 100%;
            padding: 12px 16px;
            border: none;
            border-radius: 18px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: rgba(44, 42, 40, 0.85);
            color: #f5f0ea;
        }
        .btn-primary:active {
            background: rgba(44, 42, 40, 0.95);
        }

        .btn-danger {
            background: rgba(200, 80, 80, 0.8);
            color: #fff;
        }
        .btn-danger:active {
            background: rgba(200, 80, 80, 0.9);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: #2c2a28;
        }
        .btn-secondary:active {
            background: rgba(255, 255, 255, 0.6);
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-row {
            display: flex;
            gap: 8px;
        }
        .btn-row .btn {
            flex: 1;
        }

        .api-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .api-row input {
            flex: 1;
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 14px;
            padding: 8px 12px;
            font-size: 12px;
            color: #2c2a28;
            outline: none;
            backdrop-filter: blur(10px);
        }

        .api-row input:focus {
            border-color: #b8a99a;
            background: rgba(255, 255, 255, 0.6);
        }

        .api-row .btn-small {
            padding: 8px 14px;
            border-radius: 14px;
            border: none;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #2c2a28;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }
        .api-row .btn-small:active {
            background: rgba(255, 255, 255, 0.5);
        }

        .signal-card {
            border-left: 3px solid #b8a99a;
            padding-left: 12px;
            margin-bottom: 10px;
        }
        .signal-card.shot {
            border-left-color: #c9a8a8;
        }
        .signal-card.long {
            border-left-color: #a8c9b0;
        }

        .signal-card .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .signal-card .symbol {
            font-weight: 700;
            font-size: 16px;
        }
        .signal-card .side {
            font-size: 9px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 30px;
            text-transform: uppercase;
            background: rgba(44, 42, 40, 0.06);
            color: rgba(44, 42, 40, 0.6);
        }
        .signal-card .side.shot {
            background: rgba(201, 168, 168, 0.15);
            color: #9a7a7a;
        }
        .signal-card .side.long {
            background: rgba(168, 201, 176, 0.15);
            color: #5a8a6a;
        }

        .signal-card .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 3px 10px;
            font-size: 11px;
            color: rgba(44, 42, 40, 0.4);
            margin-top: 4px;
        }
        .signal-card .meta .highlight {
            color: #2c2a28;
            font-weight: 500;
        }

        .signal-card .badge {
            display: inline-block;
            font-size: 9px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 20px;
            background: rgba(44, 42, 40, 0.06);
            color: rgba(44, 42, 40, 0.5);
        }
        .signal-card .badge.green {
            background: rgba(125, 155, 122, 0.15);
            color: #5a8a6a;
        }
        .signal-card .badge.orange {
            background: rgba(200, 160, 100, 0.15);
            color: #b08a4a;
        }
        .signal-card .badge.red {
            background: rgba(200, 120, 120, 0.15);
            color: #9a5a5a;
        }

        .status-text {
            text-align: center;
            font-size: 13px;
            color: rgba(44, 42, 40, 0.25);
            padding: 12px 0 6px;
        }

        .fade-in {
            animation: fadeUp 0.4s ease both;
        }
        .fade-in-d1 { animation-delay: 0.04s; }
        .fade-in-d2 { animation-delay: 0.08s; }
        .fade-in-d3 { animation-delay: 0.12s; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .mt-1 { margin-top: 4px; }
        ::-webkit-scrollbar { width: 0; }
    </style>
</head>
<body>

<div class="bg-animation">
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
</div>

<div class="container">

    <!-- HEADER -->
    <div class="header fade-in">
        <h1>✦ CryptoSky</h1>
        <span class="badge" id="statusBadge">● Ожидание</span>
    </div>

    <!-- СТАТУС -->
    <div class="glass fade-in fade-in-d1" id="statusCard">
        <div class="status-row">
            <div class="spinner hidden" id="spinner"></div>
            <div class="status-main" id="mainStatus"><span style="font-weight:600;">⏳</span> Ожидание запуска</div>
        </div>
        <div class="status-sub" id="subStatus"></div>
        <div class="progress-wrap">
            <div class="progress-bar">
                <div class="fill" id="progressFill" style="width:0%;"></div>
            </div>
        </div>
    </div>

    <!-- API -->
    <div class="glass fade-in fade-in-d1">
        <div class="api-row">
            <input type="text" id="apiUrlInput" placeholder="https://твой-адрес.ngrok-free.dev">
            <button class="btn-small" onclick="setApiUrl()">Обновить</button>
        </div>
    </div>

    <!-- НАСТРОЙКИ -->
    <div class="glass fade-in fade-in-d2">
        <span class="label">⚙️ Параметры</span>
        <div class="input-group">
            <div class="field">
                <label>Объём (M$)</label>
                <input type="number" id="volumeFilter" value="50" step="10">
            </div>
            <div class="field">
                <label>ATR %</label>
                <input type="number" id="atrFilter" value="50" step="5">
            </div>
            <div class="field">
                <label>Тейк x</label>
                <input type="number" id="riskReward" value="3.0" step="0.5">
            </div>
        </div>
        <button class="btn btn-secondary mt-1" onclick="saveSettings()">💾 Сохранить</button>
    </div>

    <!-- КНОПКИ -->
    <div class="btn-group fade-in fade-in-d3">
        <button class="btn btn-primary" onclick="runScanner()">🚀 Запустить сканер</button>
        <button class="btn btn-danger" onclick="stopScanner()" id="stopBtn" style="display:none;">⏹ Остановить</button>
        <div class="btn-row">
            <button class="btn btn-secondary" onclick="loadHistory()">📜 История</button>
            <button class="btn btn-secondary" onclick="clearSignals()">🗑️ Очистить</button>
        </div>
    </div>

    <!-- СИГНАЛЫ -->
    <div id="signalsContainer">
        <div class="status-text">📭 Нет сигналов</div>
    </div>

    <div class="status-text" id="statusMessage" style="font-size:11px; padding-top: 2px;"></div>

</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let statusInterval = null;

    function getApiUrl() {
        let url = localStorage.getItem('apiUrl');
        if (!url) {
            url = 'https://shame-edging-vagueness.ngrok-free.dev';
            localStorage.setItem('apiUrl', url);
        }
        document.getElementById('apiUrlInput').value = url;
        return url;
    }

    function setApiUrl() {
        const url = document.getElementById('apiUrlInput').value.trim();
        if (url) {
            localStorage.setItem('apiUrl', url);
            document.getElementById('statusMessage').innerText = '✅ API обновлён';
            loadSettings();
        }
    }

    function setAppState(state, data) {
        const body = document.body;
        const badge = document.getElementById('statusBadge');
        const mainStatus = document.getElementById('mainStatus');
        const subStatus = document.getElementById('subStatus');
        const spinner = document.getElementById('spinner');
        const progress = document.getElementById('progressFill');
        const stopBtn = document.getElementById('stopBtn');

        body.className = '';
        badge.className = 'badge';

        switch (state) {
            case 'scanning':
                body.classList.add('state-scanning');
                badge.classList.add('scanning');
                badge.textContent = '🔍 Анализ...';
                spinner.classList.remove('hidden');
                const pct = data?.total > 0 ? Math.round((data.checked / data.total) * 100) : 0;
                progress.style.width = pct + '%';
                mainStatus.innerHTML = '<span style="font-weight:600;">🔍</span> Сканер запущен';
                subStatus.textContent = data?.current_symbol ? `${data.current_symbol} (${data.checked || 0}/${data.total || 0})` : `Анализ... (${data?.checked || 0}/${data?.total || 0})`;
                stopBtn.style.display = 'block';
                break;
            case 'done':
                body.classList.add('state-done');
                badge.classList.add('done');
                badge.textContent = '✅ Завершён';
                spinner.classList.add('hidden');
                progress.style.width = '100%';
                mainStatus.innerHTML = '<span style="font-weight:600;">✅</span> Анализ завершён';
                subStatus.textContent = data ? `Проверено ${data.total || 0} монет` : '';
                stopBtn.style.display = 'none';
                break;
            case 'stopped':
                body.classList.add('state-stopped');
                badge.classList.add('stopped');
                badge.textContent = '⏹ Остановлен';
                spinner.classList.add('hidden');
                progress.style.width = '0%';
                mainStatus.innerHTML = '<span style="font-weight:600;">⏹</span> Остановлен';
                subStatus.textContent = '';
                stopBtn.style.display = 'none';
                break;
            case 'error':
                body.classList.add('state-error');
                badge.classList.add('error');
                badge.textContent = '❌ Ошибка';
                spinner.classList.add('hidden');
                mainStatus.innerHTML = `<span style="font-weight:600;">❌</span> ${data?.current_symbol || 'Ошибка'}`;
                subStatus.textContent = '';
                stopBtn.style.display = 'none';
                break;
            default:
                body.className = '';
                badge.className = 'badge';
                badge.textContent = '● Ожидание';
                spinner.classList.add('hidden');
                progress.style.width = '0%';
                mainStatus.innerHTML = '<span style="font-weight:600;">⏳</span> Ожидание запуска';
                subStatus.textContent = '';
                stopBtn.style.display = 'none';
                break;
        }
    }

    async function updateStatusUI() {
        const apiUrl = getApiUrl();
        try {
            const resp = await fetch(apiUrl + '/status');
            if (!resp.ok) return;
            const data = await resp.json();

            if (data.status === 'scanning') setAppState('scanning', data);
            else if (data.status === 'done') setAppState('done', data);
            else if (data.status === 'stopped') setAppState('stopped');
            else if (data.status === 'error') setAppState('error', data);
            else setAppState('idle');
        } catch (e) {}
    }

    async function startStatusPolling() {
        if (statusInterval) clearInterval(statusInterval);
        await updateStatusUI();
        statusInterval = setInterval(updateStatusUI, 2000);
    }

    async function stopScanner() {
        const apiUrl = getApiUrl();
        document.getElementById('statusMessage').innerText = '⏳ Остановка...';
        try {
            const resp = await fetch(apiUrl + '/stop_scanner', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
            const data = await resp.json();
            document.getElementById('statusMessage').innerText = data.status === 'stop_requested' ? '⏹ Остановлен' : 'ℹ️ Не запущен';
            await updateStatusUI();
        } catch (e) {
            document.getElementById('statusMessage').innerText = '❌ ' + e.message;
        }
    }

    async function loadSettings() {
        const apiUrl = getApiUrl();
        try {
            const resp = await fetch(apiUrl + '/settings');
            if (!resp.ok) throw new Error('Ошибка загрузки');
            const data = await resp.json();
            if (data.volume) document.getElementById('volumeFilter').value = data.volume;
            if (data.atr) document.getElementById('atrFilter').value = data.atr;
            if (data.risk_reward) document.getElementById('riskReward').value = data.risk_reward;
            document.getElementById('statusMessage').innerText = '✅ Настройки загружены';
        } catch (e) {
            document.getElementById('statusMessage').innerText = '❌ ' + e.message;
        }
    }

    async function saveSettings() {
        const apiUrl = getApiUrl();
        const settings = {
            volume: parseInt(document.getElementById('volumeFilter').value),
            atr: parseInt(document.getElementById('atrFilter').value),
            risk_reward: parseFloat(document.getElementById('riskReward').value)
        };
        try {
            const resp = await fetch(apiUrl + '/settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(settings)
            });
            if (!resp.ok) throw new Error('Ошибка сохранения');
            document.getElementById('statusMessage').innerText = '✅ Настройки сохранены!';
        } catch (e) {
            document.getElementById('statusMessage').innerText = '❌ ' + e.message;
        }
    }

    async function runScanner() {
        const apiUrl = getApiUrl();
        document.getElementById('statusMessage').innerText = '⏳ Запуск...';
        try {
            const resp = await fetch(apiUrl + '/run_scanner', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: 1907661832 })
            });
            if (!resp.ok) throw new Error('Ошибка запуска');
            document.getElementById('statusMessage').innerText = '✅ Запущен';
            startStatusPolling();
        } catch (e) {
            document.getElementById('statusMessage').innerText = '❌ ' + e.message;
        }
    }

    async function loadHistory() {
        const apiUrl = getApiUrl();
        document.getElementById('statusMessage').innerText = '⏳ История...';
        try {
            const resp = await fetch(apiUrl + '/history');
            if (!resp.ok) throw new Error('Ошибка загрузки');
            const data = await resp.json();
            if (data.length === 0) {
                document.getElementById('statusMessage').innerText = '📭 История пуста';
                displaySignals([]);
                return;
            }
            displaySignals(data);
            document.getElementById('statusMessage').innerText = `📜 ${data.length} сигналов`;
        } catch (e) {
            document.getElementById('statusMessage').innerText = '❌ ' + e.message;
        }
    }

    function clearSignals() {
        if (confirm('Очистить список?')) {
            displaySignals([]);
            document.getElementById('statusMessage').innerText = '🗑️ Очищено';
        }
    }

    function displaySignals(signals) {
        const container = document.getElementById('signalsContainer');
        if (!signals || signals.length === 0) {
            container.innerHTML = '<div class="status-text">📭 Нет сигналов</div>';
            return;
        }
        let html = '';
        signals.forEach((s, i) => {
            const sideClass = s.side && s.side.includes('LONG') ? 'long' : 'shot';
            const sideLabel = s.side || '—';
            const delay = i * 0.05;
            let badge = '';
            if (s.atr_status === '🟢') badge = '<span class="badge green">🔋 Много энергии</span>';
            else if (s.atr_status === '🟠') badge = '<span class="badge orange">⚡ Средний запас</span>';
            else if (s.atr_status === '🔴') badge = '<span class="badge red">🪫 Мало энергии</span>';

            html += `
                <div class="glass signal-card ${sideClass} fade-in" style="animation-delay: ${delay}s;">
                    <div class="row">
                        <span class="symbol">${s.symbol || '—'}</span>
                        <span class="side ${sideClass}">${sideLabel}</span>
                    </div>
                    <div class="meta">
                        <span>💰 <span class="highlight">${s.current_price || '—'}</span></span>
                        <span>📊 ${s.signal_type || '—'}</span>
                        <span>📈 ${s.level || '—'}</span>

                        <span>Вход: <span class="highlight">${s.entry || '—'}</span></span>
                        <span>Стоп: <span class="highlight">${s.stop || '—'}</span></span>

                    </div>
                    <div class="meta">
                        <span>📐 ${s.risk_reward || '—'}</span>
                        <span>🔁 ${s.touches || 0}</span>
                    </div>
                    <div class="meta">
                        <span>📊 ${s.atr_used || '—'}</span>
                        <span>⏳ ${s.atr_consumed || 0}%</span>
                        ${badge}
                    </div>
                    <div class="meta">
                        <span>💵 ${s.daily_volume_usd || '—'}M</span>
                        <span>${s.time || ''}</span>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    window.Telegram.WebApp.onEvent('data', (data) => {
        try {
            const parsed = JSON.parse(data);
            if (parsed.type === 'signals') {
                displaySignals(parsed.data);
                document.getElementById('statusMessage').innerText = `✅ ${parsed.data.length} сигналов`;
            }
        } catch (e) {}
    });

    loadSettings();
    startStatusPolling();
