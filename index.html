<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CryptoSky · iOS Glass</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            padding: 12px 16px 30px;
            display: flex;
            flex-direction: column;
            color: #1e1e1e;
            position: relative;
            overflow-x: hidden;
            background: #c8c8c8;
        }

        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: linear-gradient(-45deg, #b8b8b8, #a8a8a8, #b0b0b0, #9a9a9a);
            background-size: 400% 400%;
            animation: gradientShift 20s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .bubbles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            bottom: -60px;
            background: rgba(50, 50, 50, 0.12);
            border-radius: 50%;
            animation: floatUp linear infinite;
        }

        .bubble:nth-child(1) { left: 5%; width: 80px; height: 80px; animation-duration: 22s; animation-delay: 0s; }
        .bubble:nth-child(2) { left: 20%; width: 40px; height: 40px; animation-duration: 18s; animation-delay: 3s; }
        .bubble:nth-child(3) { left: 35%; width: 120px; height: 120px; animation-duration: 26s; animation-delay: 1s; }
        .bubble:nth-child(4) { left: 50%; width: 60px; height: 60px; animation-duration: 20s; animation-delay: 5s; }
        .bubble:nth-child(5) { left: 65%; width: 90px; height: 90px; animation-duration: 24s; animation-delay: 2s; }
        .bubble:nth-child(6) { left: 80%; width: 50px; height: 50px; animation-duration: 19s; animation-delay: 4s; }
        .bubble:nth-child(7) { left: 92%; width: 100px; height: 100px; animation-duration: 28s; animation-delay: 6s; }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8); opacity: 0.4; }
            100% { transform: translateY(-110vh) scale(1.2); opacity: 0; }
        }

        .glow {
            position: fixed;
            top: -30%;
            left: -20%;
            width: 70%;
            height: 70%;
            background: radial-gradient(circle, rgba(120, 120, 120, 0.10), transparent 70%);
            border-radius: 50%;
            z-index: 0;
            animation: glowPulse 8s ease-in-out infinite;
            pointer-events: none;
        }

        .glow2 {
            position: fixed;
            bottom: -20%;
            right: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(100, 100, 100, 0.08), transparent 70%);
            border-radius: 50%;
            z-index: 0;
            animation: glowPulse 10s ease-in-out infinite reverse;
            pointer-events: none;
        }

        @keyframes glowPulse {
            0%, 100% { transform: scale(1); opacity: 0.4; }
            50% { transform: scale(1.3); opacity: 0.9; }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 440px;
            margin: 0 auto;
            width: 100%;
        }

        .glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(60px) saturate(1.4);
            -webkit-backdrop-filter: blur(60px) saturate(1.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 32px;
            padding: 18px 16px;
            box-shadow: 0 12px 50px -8px rgba(0, 0, 0, 0.05),
                        0 1px 0 0 rgba(255, 255, 255, 0.2) inset;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            margin-bottom: 11px;
        }

        .glass:active {
            transform: scale(0.97);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding: 0 2px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            color: #1e1e1e;
            letter-spacing: -0.5px;
        }

        .header .status {
            font-size: 13px;
            font-weight: 500;
            color: rgba(30, 30, 30, 0.5);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header .status .dot {
            width: 8px;
            height: 8px;
            background: #6a8a6a;
            border-radius: 50%;
            display: inline-block;
            animation: pulseDot 2s infinite;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        .label {
            font-size: 12px;
            font-weight: 600;
            color: rgba(30, 30, 30, 0.35);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            display: block;
            margin-bottom: 6px;
        }

        .input-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 4px;
        }

        .input-group .field {
            flex: 1;
            min-width: 70px;
        }

        .input-group .field label {
            font-size: 11px;
            color: rgba(30, 30, 30, 0.35);
            display: block;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .input-group .field input {
            width: 100%;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            padding: 14px 16px;
            font-size: 16px;
            font-weight: 500;
            color: #1e1e1e;
            outline: none;
            transition: 0.25s ease;
            backdrop-filter: blur(20px);
        }

        .input-group .field input:focus {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.18);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.05);
        }

        /* --- КНОПКИ (отступ 3 мм) --- */
        .btn {
            width: 100%;
            padding: 16px 20px;
            border: none;
            border-radius: 22px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 11px;
        }

        .btn:last-child {
            margin-bottom: 0;
        }

        .btn-primary {
            background: rgba(30, 30, 30, 0.15);
            color: #1e1e1e;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }

        .btn-primary:active {
            transform: scale(0.96);
            background: rgba(30, 30, 30, 0.25);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #1e1e1e;
        }

        .btn-secondary:active {
            background: rgba(255, 255, 255, 0.12);
            transform: scale(0.97);
        }

        /* --- РЯД КНОПОК (ИСТОРИЯ + ОЧИСТИТЬ) --- */
        .btn-group-row {
            display: flex;
            gap: 11px;
        }

        .btn-group-row .btn {
            flex: 1;
            margin-bottom: 0;
        }

        /* --- КАРТОЧКИ СИГНАЛОВ --- */
        .signal-card {
            border-left: 3px solid rgba(30, 30, 30, 0.2);
            padding-left: 14px;
            margin-bottom: 11px;
        }

        .signal-card:last-child {
            margin-bottom: 0;
        }

        .signal-card.shot {
            border-left-color: rgba(180, 100, 100, 0.4);
        }

        .signal-card.long {
            border-left-color: rgba(100, 180, 120, 0.4);
        }

        .signal-card .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .signal-card .row .symbol {
            font-weight: 700;
            font-size: 18px;
            color: #1e1e1e;
        }

        .signal-card .row .side {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 14px;
            border-radius: 40px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            background: rgba(30, 30, 30, 0.05);
            color: rgba(30, 30, 30, 0.6);
        }

        .signal-card .row .side.shot {
            background: rgba(180, 100, 100, 0.10);
            color: #8a5a5a;
        }

        .signal-card .row .side.long {
            background: rgba(100, 180, 120, 0.10);
            color: #4a7a5a;
        }

        .signal-card .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 14px;
            font-size: 13px;
            color: rgba(30, 30, 30, 0.4);
            margin-top: 8px;
        }

        .signal-card .meta .highlight {
            color: #1e1e1e;
            font-weight: 500;
        }

        .signal-card .badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 20px;
            background: rgba(30, 30, 30, 0.04);
            color: rgba(30, 30, 30, 0.5);
        }

        .signal-card .badge.green {
            background: rgba(100, 180, 120, 0.10);
            color: #4a7a5a;
        }

        .signal-card .badge.orange {
            background: rgba(200, 160, 100, 0.10);
            color: #8a7a4a;
        }

        .signal-card .badge.red {
            background: rgba(180, 100, 100, 0.10);
            color: #8a5a5a;
        }

        .status-text {
            text-align: center;
            font-size: 14px;
            color: rgba(30, 30, 30, 0.2);
            padding: 20px 0;
            letter-spacing: 0.3px;
        }

        .fade-in {
            animation: fadeUp 0.6s ease both;
        }
        .fade-in-d1 { animation-delay: 0.05s; }
        .fade-in-d2 { animation-delay: 0.1s; }
        .fade-in-d3 { animation-delay: 0.15s; }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .mt-1 { margin-top: 8px; }
        .flex { display: flex; align-items: center; gap: 8px; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .gap-1 { gap: 6px; }
        ::-webkit-scrollbar { width: 0; }
    </style>
</head>
<body>

<div class="animated-bg"></div>
<div class="glow"></div>
<div class="glow2"></div>
<div class="bubbles">
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
</div>

<div class="container">
    <div class="header fade-in">
        <h1>✦ CryptoSky</h1>
        <div class="status">
            <span class="dot"></span> Активен
        </div>
    </div>

    <div class="glass fade-in fade-in-d1">
        <span class="label">⚙️ Параметры</span>
        <div class="input-group">
            <div class="field">
                <label>Объём (M$)</label>
                <input type="number" id="volumeFilter" value="50" step="10">
            </div>
            <div class="field">
                <label>ATR %</label>
                <input type="number" id="atrFilter" value="50" step="5">
            </div>
        </div>
        <button class="btn btn-secondary mt-1" onclick="saveSettings()">💾 Сохранить</button>
    </div>

    <div class="btn-group fade-in fade-in-d2">
        <button class="btn btn-primary" onclick="runScanner()">🚀 Запустить сканер</button>
        <div class="btn-group-row">
            <button class="btn btn-secondary" onclick="loadHistory()">📜 История</button>
            <button class="btn btn-secondary" onclick="clearSignals()">🗑️ Очистить</button>
        </div>
    </div>

    <div id="signalsContainer">
        <div class="status-text">📭 Нет сигналов</div>
    </div>

    <div class="status-text" id="statusMessage" style="font-size:13px;"></div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const API_URL = localStorage.getItem('apiUrl') || 'https://shame-edging-vagueness.ngrok-free.dev';

    async function loadSettings() {
        try {
            const resp = await fetch(API_URL + '/settings');
            if (!resp.ok) throw new Error('Ошибка загрузки');
            const data = await resp.json();
            if (data.volume) document.getElementById('volumeFilter').value = data.volume;
            if (data.atr) document.getElementById('atrFilter').value = data.atr;
            document.getElementById('statusMessage').innerText = '✅ Настройки загружены';
        } catch (e) {
            document.getElementById('statusMessage').innerText = '❌ Ошибка загрузки: ' + e.message;
        }
    }

    async function saveSettings() {
        const settings = {
            volume: parseInt(document.getElementById('volumeFilter').value),
            atr: parseInt(document.getElementById('atrFilter').value)
        };
        try {
            const resp = await fetch(API_URL + '/settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(settings)
            });
            if (!resp.ok) throw new Error('Ошибка сохранения');
            document.getElementById('statusMessage').innerText = '✅ Настройки сохранены!';
        } catch (e) {
            document.getElementById('statusMessage').innerText = '❌ Ошибка сохранения: ' + e.message;
        }
    }

    async function runScanner() {
        document.getElementById('statusMessage').innerText = '⏳ Запуск сканера...';
        try {
            const resp = await fetch(API_URL + '/run_scanner', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: 1907661832 })
            });
            if (!resp.ok) throw new Error('Ошибка запуска');
            document.getElementById('statusMessage').innerText = '✅ Сканер запущен. Ждите сигналов в Telegram!';
        } catch (e) {
            document.getElementById('statusMessage').innerText = '❌ Ошибка: ' + e.message;
        }
    }

    async function loadHistory() {
        document.getElementById('statusMessage').innerText = '⏳ Загрузка истории...';
        try {
            const resp = await fetch(API_URL + '/history');
            if (!resp.ok) throw new Error('Ошибка загрузки');
            const data = await resp.json();
            if (data.length === 0) {
                document.getElementById('statusMessage').innerText = '📭 История пуста';
                displaySignals([]);
                return;
            }
            displaySignals(data);
            document.getElementById('statusMessage').innerText = `📜 Показано ${data.length} сигналов (за 7 дней)`;
        } catch (e) {
            document.getElementById('statusMessage').innerText = '❌ Ошибка: ' + e.message;
        }
    }

    function clearSignals() {
        if (confirm('Очистить список сигналов?')) {
            displaySignals([]);
            document.getElementById('statusMessage').innerText = '🗑️ Список очищен';
        }
    }

    function displaySignals(signals) {
        const container = document.getElementById('signalsContainer');
        if (!signals || signals.length === 0) {
            container.innerHTML = '<div class="status-text">📭 Нет сигналов</div>';
            return;
        }
        let html = '';
        signals.forEach((s, i) => {
            const sideClass = s.side && s.side.includes('LONG') ? 'long' : 'shot';
            const sideLabel = s.side || '—';
            const delay = i * 0.06;

            let statusBadge = '';
            if (s.atr_status === '🟢') statusBadge = '<span class="badge green">🔋 Много энергии</span>';
            else if (s.atr_status === '🟠') statusBadge = '<span class="badge orange">⚡ Средний запас</span>';
            else if (s.atr_status === '🔴') statusBadge = '<span class="badge red">🪫 Мало энергии</span>';

            html += `
                <div class="glass signal-card ${sideClass} fade-in" style="animation-delay: ${delay}s;">
                    <div class="row">
                        <span class="symbol">${s.symbol || '—'}</span>
                        <span class="side ${sideClass}">${sideLabel}</span>
                    </div>
                    <div class="meta">
                        <span>💰 <span class="highlight">${s.current_price || '—'}</span></span>
                        <span>📊 ${s.signal_type || '—'}</span>
                        <span>📈 ${s.level || '—'}</span>
                    </div>
                    <div class="meta">
                        <span>Вход: <span class="highlight">${s.entry || '—'}</span></span>
                        <span>Стоп: <span class="highlight">${s.stop || '—'}</span></span>
                        <span>Тейк: <span class="highlight">${s.tp || '—'}</span></span>
                    </div>
                    <div class="meta">
                        <span>📐 ${s.risk_reward || '—'}</span>
                        <span>🔁 Касаний: <span class="highlight">${s.touches || 0}</span></span>
                    </div>
                    <div class="meta">
                        <span>📊 ATR: <span class="highlight">${s.atr_used || '—'}</span></span>
                        <span>⏳ Запас: ${s.atr_consumed || 0}%</span>
                        ${statusBadge}
                    </div>
                    <div class="meta">
                        <span>💵 ${s.daily_volume_usd || '—'}M</span>
                        <span>${s.time || ''}</span>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    window.Telegram.WebApp.onEvent('data', (data) => {
        try {
            const parsed = JSON.parse(data);
            if (parsed.type === 'signals') {
                displaySignals(parsed.data);
                document.getElementById('statusMessage').innerText = `✅ Получено ${parsed.data.length} сигналов`;
            }
        } catch (e) {
            console.error('Ошибка данных от бота:', e);
        }
    });

    loadSettings();

    setTimeout(() => {
        const demo = [
            { symbol: 'BTCUSDT', side: 'LONG (ОТБОЙ S1)', current_price: '61234.56', entry: '61200.00', stop: '61100.00', tp: '61500.00', daily_volume_usd: '450.2', signal_type: 'ОТБОЙ', level: '61150.00', risk_reward: '1:3.0', touches: 3, atr_used: '850.5', atr_consumed: '45.2', atr_status: '🟢', time: '2026-08-13 14:30' },
            { symbol: 'SOLUSDT', side: 'SHORT (ПРОБОЙ R1)', current_price: '75.28', entry: '75.13', stop: '73.40', tp: '80.32', daily_volume_usd: '1044.95', signal_type: 'ПРОБОЙ', level: '75.28', risk_reward: '1:4.6', touches: 9, atr_used: '2.16', atr_consumed: '26.9', atr_status: '🟢', time: '2026-08-13 14:25' }
        ];
        displaySignals(demo);
    }, 700);
</script>

</body>
</html>
